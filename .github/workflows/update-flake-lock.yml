name: Update flake.lock

on:
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # The hoard and revo inputs are private repos: fetch them with their read-only deploy keys
      # (Actions secrets, never in this repo). The action also adds GitHub's host keys to known_hosts.
      # A deploy key only works for one repo, so the revo key must have the repo URL as its comment
      # (ssh-keygen -C "git@github.com:larsschwegmann/revo-timetracking.git"): the action then routes
      # that repo through its own host alias. HOARDAPP_DEPLOY_KEY stays first for plain github.com.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.HOARDAPP_DEPLOY_KEY }}
            ${{ secrets.REVO_DEPLOY_KEY }}

      - name: Update flake.lock
        run: nix flake update

      - name: Commit and push if changed
        run: |
          git diff --quiet flake.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake.lock: update $(date -u +%Y-%m-%d)"
          git push
